---
# Test infrastructure: Redis for Caddy's certificate store, curl for a TLS
# probe, and packaged Caddy to exercise migration to the custom build.
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Install the test dependencies
      ansible.builtin.apt:
        name:
          - caddy
          - redis-server
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Start Redis
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: true
