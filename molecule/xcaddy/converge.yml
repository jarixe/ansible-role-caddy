---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  vars:
    # The path this stack actually runs in production: a binary built with a
    # third-party module, which is where the version pinning and the rebuild
    # stamp have to hold. Everything is pinned so a build here is reproducible
    # and a rebuild is only ever triggered by editing these values.
    caddy_install_method: xcaddy
    caddy_version: v2.11.4
    caddy_go_version: "1.26.7"
    caddy_xcaddy_version: v0.4.7
    caddy_extra_modules:
      - github.com/pberkel/caddy-storage-redis

    caddy_acme_email: acme@example.invalid

    # The clustering mechanism this stack depends on: certificates and the
    # issuance lock live in Redis instead of on local disk, which is what lets
    # two nodes behind one floating IP share a store. Real ACME needs a public
    # address, so local_certs substitutes Caddy's internal CA — the issuer
    # changes, the storage path being exercised does not.
    caddy_global_extra: |
      local_certs
      storage redis {
          address 127.0.0.1:6379
          db 0
          key_prefix caddy
      }

    # The unit this role owns must keep this out of the journal.
    caddy_systemd_env:
      CADDY_TEST_TOKEN: not-a-real-secret

    caddy_sites:
      # Plain HTTP, for the proxy probe.
      - host: http://xcaddy.example.invalid
        upstream: 127.0.0.1:8081
        access_log: true

      # A bare hostname, so Caddy provisions a certificate for it through the
      # storage module above.
      - host: tls.example.invalid
        upstream: 127.0.0.1:8081

      # Validate the non-default fallback syntax against the exact Caddy
      # release used by production, not the older package in the apt scenario.
      - host: http://affinity.example.invalid
        upstream: 127.0.0.1:8081 127.0.0.1:8082
        request_affinity:
          header: X-Role-Affinity-Key
          fallback_policy: least_conn
          rules:
            - name: test_user
              pattern: ^/user/(?P<key>[^/]+)(?:/|$)
        extra_directives: |
          respond /private "Forbidden" 403
  roles:
    - role: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
