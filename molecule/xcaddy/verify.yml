---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Collect installed package facts
      ansible.builtin.package_facts:

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Read the installed Caddy version
      ansible.builtin.command: caddy version
      changed_when: false
      register: caddy_verify_version

    - name: Read the compiled-in modules
      ansible.builtin.command: caddy list-modules
      changed_when: false
      register: caddy_verify_modules

    - name: Read the build stamp and the unit
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: caddy_verify_files
      loop:
        - /usr/local/src/caddy/build.stamp
        - /etc/systemd/system/caddy.service

    - name: Read the installed Go version
      ansible.builtin.command: /usr/local/go/bin/go version
      changed_when: false
      register: caddy_verify_go

    - name: Verify the built binary matches what was requested
      ansible.builtin.assert:
        that:
          - ansible_facts.services['caddy.service'].state == 'running'
          - "'caddy' not in ansible_facts.packages"
          # The pin is the point: an unpinned build follows upstream releases
          # and swaps the binary under a running edge node.
          - "'v2.11.4' in caddy_verify_version.stdout"
          - "'storage.redis' in caddy_verify_modules.stdout"
          - caddy_verify_go.stdout.split(' ')[2] == 'go1.26.7'

    - name: Verify the build stamp records the requested build
      ansible.builtin.assert:
        that:
          - "'caddy=v2.11.4' in caddy_verify_stamp"
          - "'go=1.26.7' in caddy_verify_stamp"
          - "'go_arch=amd64' in caddy_verify_stamp"
          - "'xcaddy=v0.4.7' in caddy_verify_stamp"
          - "'modules=github.com/pberkel/caddy-storage-redis' in caddy_verify_stamp"
      vars:
        caddy_verify_stamp: "{{ caddy_verify_files.results[0].content | b64decode }}"

    - name: Check for persistent xcaddy build artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/src/caddy/workspace
        - /usr/local/src/caddy/caddy-staging
      register: caddy_verify_build_artifacts

    - name: Verify xcaddy build artifacts were cleaned
      ansible.builtin.assert:
        that:
          - caddy_verify_build_artifacts.results | map(attribute='stat.exists') | select | list | length == 0

    # --environ prints every variable in the drop-in — which is the documented
    # home for ACME provider tokens — into the journal on every start.
    - name: Verify the role-owned unit does not dump its environment
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile' in caddy_verify_unit"
          - >-
            'ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force'
            in caddy_verify_unit
          - caddy_verify_exec_lines | select('search', '--environ') | list | length == 0
      vars:
        caddy_verify_unit: "{{ caddy_verify_files.results[1].content | b64decode }}"
        caddy_verify_exec_lines: >-
          {{ caddy_verify_unit | regex_findall('^Exec.*$', multiline=True) }}

    # The point of the storage module: certificates must land in Redis, not on
    # local disk, or two nodes behind one floating IP cannot share a store and
    # the passive node can never renew. redis-cli is the only way to look.
    - name: Read the certificate store  # noqa: command-instead-of-module
      ansible.builtin.command: redis-cli --scan --pattern 'caddy*'
      changed_when: false
      register: caddy_verify_store
      until: caddy_verify_store.stdout_lines | length > 0
      retries: 10
      delay: 3

    - name: Look for certificates left on local disk
      ansible.builtin.find:
        paths: "{{ caddy_data_dir | default('/var/lib/caddy') }}"
        patterns: ["*.crt", "*.key"]
        recurse: true
      register: caddy_verify_local_certs

    - name: Verify the certificate store is Redis and not the filesystem
      ansible.builtin.assert:
        that:
          - caddy_verify_store.stdout is search('caddy/certificates')
          - caddy_verify_store.stdout is search('caddy/pki/authorities/local')
          - caddy_verify_local_certs.files | length == 0
        fail_msg: >-
          Redis holds {{ caddy_verify_store.stdout_lines | length }} keys and
          {{ caddy_verify_local_certs.files | length }} certificate files were
          found under the data directory.

    # A successful handshake proves the certificate came back out of Redis and
    # was served. curl, because the uri module cannot set SNI and Caddy needs it
    # to pick the certificate.
    - name: Probe the TLS site  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -sS -k -o /dev/null -w '%{http_code}'
        --resolve tls.example.invalid:443:127.0.0.1
        https://tls.example.invalid/
      changed_when: false
      register: caddy_verify_tls

    - name: Verify the TLS site answers from the shared store
      ansible.builtin.assert:
        that:
          - caddy_verify_tls.stdout in ['502', '503']
        fail_msg: "TLS probe returned {{ caddy_verify_tls.stdout }}"

    - name: Probe the proxied site
      ansible.builtin.uri:
        url: http://127.0.0.1:80/
        headers:
          Host: xcaddy.example.invalid
        follow_redirects: none
        status_code: [502, 503]
