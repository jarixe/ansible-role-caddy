---
- name: Ensure declared Caddy access log files are writable by Caddy
  ansible.builtin.file:
    path: "{{ caddy_log_dir }}/{{ item.host }}.access.log"
    state: touch
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: '0600'
  loop: >-
    {{ caddy_sites
       | selectattr('access_log', 'defined')
       | selectattr('access_log')
       | list }}

- name: Deploy Caddyfile from template
  ansible.builtin.template:
    src: "{{ caddy_caddyfile_template }}"
    dest: "{{ caddy_caddyfile }}"
    owner: root
    group: "{{ caddy_group }}"
    mode: '0644'
    validate: 'caddy validate --config %s --adapter caddyfile'
  notify: reload caddy
  when: caddy_caddyfile_template | length > 0
