---
# Fail on an unusable combination of inputs before anything is installed. Each
# of these used to surface much later and much less clearly: an unknown install
# method silently installed nothing at all, and xcaddy without modules left the
# host with no Caddy binary — the apt repo and package are deliberately never
# touched on that path — so the first sign of trouble was `caddy validate`
# failing on a missing command.
- name: Verify the requested install method is supported
  ansible.builtin.assert:
    that:
      - caddy_install_method in ['apt', 'xcaddy']
    fail_msg: >-
      caddy_install_method must be 'apt' or 'xcaddy',
      got '{{ caddy_install_method }}'.

- name: Verify the xcaddy build has something to build
  ansible.builtin.assert:
    that:
      - caddy_extra_modules | length > 0
    fail_msg: >-
      caddy_install_method is 'xcaddy' but caddy_extra_modules is empty. The
      xcaddy path never installs the packaged binary, so this would leave the
      host without Caddy. Use the 'apt' method when no extra modules are
      needed.
  when: caddy_install_method == 'xcaddy'

- name: Verify the architecture has a mapped Go release
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture in caddy_go_arch_map
    fail_msg: >-
      No Go release architecture mapped for
      '{{ ansible_facts.architecture }}'. Extend caddy_go_arch_map.
  when: caddy_install_method == 'xcaddy'

- name: Verify the disposable build workspace is safely scoped
  ansible.builtin.assert:
    that:
      - caddy_build_dir != '/'
      - caddy_build_workspace != '/'
      - caddy_build_workspace != caddy_build_dir
      - caddy_build_workspace.startswith(caddy_build_dir.rstrip('/') ~ '/')
    fail_msg: >-
      caddy_build_workspace must be a child of caddy_build_dir because it is
      recursively removed after every build attempt.
  when: caddy_install_method == 'xcaddy'

- name: Verify request-affinity configuration
  ansible.builtin.assert:
    that:
      - item.lb_policy is not defined
      - item.request_affinity.header | length > 0
      - item.request_affinity.rules | length > 0
      - >-
        item.request_affinity.rules
        | map(attribute='name')
        | unique
        | length == item.request_affinity.rules | length
      - >-
        item.request_affinity.rules
        | selectattr('pattern', 'search', '\(\?P<key>')
        | list
        | length == item.request_affinity.rules | length
    fail_msg: >-
      Enabled request_affinity requires a non-empty internal header, unique
      rule names, a named (?P<key>...) capture in every pattern, and no
      separate lb_policy.
  loop: "{{ caddy_sites }}"
  loop_control:
    label: "{{ item.host }}"
  when:
    - item.request_affinity is defined
    - item.request_affinity.enabled | default(true) | bool
