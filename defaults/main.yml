---
# ----------------------------------------------------------------------------
# Install
# ----------------------------------------------------------------------------

# "apt"    — install from Caddy's official cloudsmith apt repo (default)
# "xcaddy" — build a custom binary; requires caddy_extra_modules to be set
caddy_install_method: apt

# Only used when caddy_install_method: xcaddy
# List of module import paths, e.g.:
#   - github.com/caddy-dns/cloudflare
#   - github.com/caddyserver/cache-handler
caddy_extra_modules: []

# Caddy version to build, as an xcaddy version argument (a git tag on
# caddyserver/caddy), e.g. "v2.10.2". Empty means "whatever xcaddy resolves as
# latest at build time" — fine for a lab, but pin it for anything that serves
# traffic: an unpinned build silently moves Caddy forward the moment upstream
# tags a release, and the new binary is installed and restarted by whatever
# deploy happens to run next.
#
# Changing this value (or caddy_extra_modules / caddy_go_version) is what
# triggers a rebuild — see caddy_build_dir below.
caddy_version: ""

# Go version to install when using xcaddy (ignored for apt). Must be new
# enough for the Caddy version being built; too old is a build failure.
# Bumping this replaces an already-installed toolchain.
caddy_go_version: "1.27.1"

# Optional checksum for the Go tarball, in ansible.builtin.get_url format
# ("sha256:<hex>"). Empty skips verification. The published value lives at
# https://go.dev/dl/ next to the tarball.
caddy_go_checksum: ""

# ansible_facts.architecture -> Go release architecture. Extend for a platform
# that is not covered; an unmapped architecture fails in preflight.
caddy_go_arch_map:
  x86_64: amd64
  aarch64: arm64

# xcaddy version to install as the build tool itself. "latest" tracks
# upstream; pin to a tag (e.g. "v0.4.4") for a fully reproducible build.
caddy_xcaddy_version: latest

# Role-owned scratch directory for the xcaddy build: holds the staged binary
# before it is installed over the live one, plus build.stamp — the record of
# what the installed binary was built from. The stamp is what makes the build
# skippable: as long as it matches the requested version, module list and Go
# version, the build is not re-run.
caddy_build_dir: /usr/local/src/caddy

# Disposable workspace for GOPATH, module/build caches and xcaddy's temporary
# build environment. It is removed after every build attempt, including failed
# builds, so repeated upgrades cannot fill the host with stale Go artifacts.
caddy_build_workspace: "{{ caddy_build_dir }}/workspace"

# Extra environment variables for the xcaddy build command, merged over the
# defaults (HOME, GOPATH, PATH). Needed e.g. to build private modules:
#   caddy_xcaddy_env:
#     GOPRIVATE: "github.com/myuser/*"
# (git credentials for the private fetch must be provided separately,
# e.g. a /root/.netrc deployed by the calling playbook)
caddy_xcaddy_env: {}

# apt behaviour, matching the surrounding roles: refresh the cache only when
# it is older than this, and wait rather than fail when another process holds
# the dpkg lock.
caddy_apt_cache_valid_time: 3600
caddy_apt_lock_timeout: 60

# Base URL of Caddy's apt repository. Only the binary index is added; nothing
# in this role builds from Debian sources.
caddy_apt_repo_url: https://dl.cloudsmith.io/public/caddy/stable/deb/debian

# State for the packaged caddy on the apt path. "present" installs and then
# leaves the version alone; "latest" upgrades to whatever the repo currently
# offers on every run. Ignored on the xcaddy path, which never installs the
# package.
caddy_apt_package_state: present

# ----------------------------------------------------------------------------
# Paths & ownership
# ----------------------------------------------------------------------------

caddy_config_dir: /etc/caddy
caddy_caddyfile: /etc/caddy/Caddyfile
caddy_data_dir: /var/lib/caddy
caddy_log_dir: /var/log/caddy

caddy_user: caddy
caddy_group: caddy

# ----------------------------------------------------------------------------
# Caddyfile template
# ----------------------------------------------------------------------------

# Jinja2 template filename (relative to the role's templates/ dir) or an
# absolute path to a caller-supplied template. Set to "" to skip deployment.
caddy_caddyfile_template: Caddyfile.j2

# ----------------------------------------------------------------------------
# systemd
# ----------------------------------------------------------------------------

# Environment variables injected into the caddy.service drop-in.
# Key-value dict, e.g.:
#   GODEBUG: tlsmlkem=0
#
# These routinely carry ACME provider tokens, so the drop-in is written
# root-owned and group-readable only.
caddy_systemd_env: {}

# Keep the variables above out of the journal. The unit this role installs on
# the xcaddy path never runs Caddy with --environ; on the apt path the unit
# belongs to the package and does, so when there is something to protect the
# drop-in resets ExecStart and redefines it without the flag. Set to false to
# keep the package's invocation verbatim — worth doing if a future package
# revision adds a flag to ExecStart that matters to you.
caddy_systemd_hide_environ: true

# ----------------------------------------------------------------------------
# TLS / global options
# ----------------------------------------------------------------------------

caddy_acme_email: ""

# Global ACME DNS-01 challenge provider, written verbatim as the global
# `acme_dns <value>` option. When set, every managed site obtains its
# certificate over DNS-01 instead of HTTP/TLS-ALPN — required for wildcard
# hosts and for hosts whose public A record does not point at this server
# (e.g. split-horizon / internal HTTPS behind an external ingress).
#
# The referenced DNS provider module must be compiled in via
# caddy_install_method: xcaddy + caddy_extra_modules, and any API token
# supplied through caddy_systemd_env. Example (Cloudflare):
#   caddy_install_method: xcaddy
#   caddy_extra_modules: [github.com/caddy-dns/cloudflare]
#   caddy_systemd_env: { CF_API_TOKEN: "{{ vault_cf_token }}" }
#   caddy_acme_dns: "cloudflare {env.CF_API_TOKEN}"
caddy_acme_dns: ""

# Raw Caddyfile directives injected verbatim into the global options block,
# for global options this role does not model explicitly. Multi-line ok.
#
# The clustering case this exists for: two Caddy nodes behind one floating IP
# cannot both answer an ACME challenge, because only the node currently
# holding the IP receives the request. Pointing both at one shared storage
# backend gives them a common certificate store and a common issuance lock, so
# whichever node holds the IP issues and both serve the result. Requires the
# matching storage module compiled in via caddy_install_method: xcaddy.
#
#   caddy_install_method: xcaddy
#   caddy_extra_modules: [github.com/pberkel/caddy-storage-redis]
#   caddy_global_extra: |
#     storage redis {
#         address 10.0.0.5:6379
#         password "{{ vault_redis_password }}"
#         db 3
#     }
#
# Quote any value that can contain a space or a Caddyfile metacharacter —
# an unquoted password breaks the parse, and the failure surfaces as a
# validation error on a file this role will not show you.
caddy_global_extra: ""

# ----------------------------------------------------------------------------
# Sites
# ----------------------------------------------------------------------------

# List of reverse-proxy sites. Every key is validated against
# meta/argument_specs.yml, so a typo fails the play instead of silently
# rendering a site without the option you meant to set. Each entry supports:
#   host:             required — public hostname
#   upstream:         required — backend address (host:port). Several,
#                                space-separated, makes this a load-balanced
#                                site; see lb_policy below.
#   lb_policy:        optional — Caddy load balancing policy across multiple
#                                upstreams (round_robin, least_conn, ip_hash,
#                                cookie, ...). Default is Caddy's own (random).
#   health_uri:       optional — path for ACTIVE health checks. Without it
#                                Caddy only marks an upstream down after a
#                                request to it has already failed (passive),
#                                so the first user after a backend dies eats
#                                the error. With it, Caddy polls out of band
#                                and takes the backend out before that.
#   health_interval:  optional — how often to poll (default 30s)
#   health_timeout:   optional — per-probe timeout
#   health_port:      optional — probe a different port than the upstream's
#   health_status:    optional — acceptable status, e.g. 2xx (default 200)
#   health_body:      optional — regexp the probe response body must match
#   fail_duration:    optional — how long a passively-failed upstream stays
#                                out of rotation (default 0 = passive checks
#                                disabled)
#   max_fails:        optional — failures within fail_duration before an
#                                upstream is taken out (default 1)
#   unhealthy_status: optional — statuses counted as a failure, e.g. [5xx]
#   unhealthy_latency: optional — a response slower than this counts as a
#                                failure
#   unhealthy_request_count: optional — concurrent requests at which an
#                                upstream counts as unhealthy
#   lb_retries:       optional — retries against other upstreams before giving
#                                up on a request
#   lb_try_duration:  optional — how long to keep retrying other upstreams
#                                before giving up on the request
#   lb_try_interval:  optional — wait between those retries (default 250ms)
#   access_log:       optional — enable per-site JSON access log at
#                                {{ caddy_log_dir }}/<host>.access.log
#   allow_ips:        optional — whole-site IP allowlist (list of IPs/CIDRs).
#                                Clients outside it get 403; everything else
#                                declared on the site still applies.
#   protected_paths:  optional — list of { path, allow_ips } for per-path restrictions
#   import_snippets:  optional — list of caddy_snippets names to `import` into the site
#   import_files:     optional — list of file paths to `import` into the site (e.g. a
#                                runtime-managed snippet owned by another process)
#   extra_directives: optional — raw Caddyfile directives injected verbatim into the
#                                site block, just before reverse_proxy (multi-line ok)
#   upstream_tls_skip_verify: optional — proxy over HTTPS without verifying the
#                                upstream certificate
caddy_sites: []

# Reusable Caddy snippets, rendered as `(name) { body }` at the top of the
# Caddyfile. A site pulls one in with `import_snippets: [name]`. Body is raw
# Caddyfile. Example:
#
# caddy_snippets:
#   security_headers: |
#     header {
#         Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
#         X-Content-Type-Options nosniff
#         X-Frame-Options DENY
#         Referrer-Policy strict-origin-when-cross-origin
#         -Server
#     }
#   compression: |
#     encode zstd gzip
caddy_snippets: {}

# Expose a Prometheus metrics endpoint on this address/port, over plain HTTP.
# Set caddy_metrics_bind to "" to disable the metrics server entirely.
# An empty caddy_metrics_allow_ips exposes it to every client that can reach
# the bind address.
caddy_metrics_bind: ""
caddy_metrics_port: 9090
caddy_metrics_allow_ips: []
